services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - default
      - database
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-agentix}
      DB_USER: ${DB_USER:-agentix}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-openrouter/free}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-flash}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SPECIALIST_LLM_PROVIDER: ${SPECIALIST_LLM_PROVIDER:-groq}
      SPECIALIST_LLM_MODEL: ${SPECIALIST_LLM_MODEL:-}
      SUPERVISOR_LLM_PROVIDER: ${SUPERVISOR_LLM_PROVIDER:-groq}
      SUPERVISOR_LLM_MODEL: ${SUPERVISOR_LLM_MODEL:-}
      SUPERVISOR_FALLBACK_ENABLED: ${SUPERVISOR_FALLBACK_ENABLED:-false}
      SUPERVISOR_FALLBACK_1_PROVIDER: ${SUPERVISOR_FALLBACK_1_PROVIDER-gemini}
      SUPERVISOR_FALLBACK_1_MODEL: ${SUPERVISOR_FALLBACK_1_MODEL:-gemini-2.5-flash}
      SUPERVISOR_FALLBACK_2_PROVIDER: ${SUPERVISOR_FALLBACK_2_PROVIDER-openrouter}
      SUPERVISOR_FALLBACK_2_MODEL: ${SUPERVISOR_FALLBACK_2_MODEL:-openrouter/free}
      GEMINI_FREE_TIER_CONFIRMED: ${GEMINI_FREE_TIER_CONFIRMED:-false}
      GROQ_FREE_TIER_CONFIRMED: ${GROQ_FREE_TIER_CONFIRMED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-Agentix <noreply@example.com>}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import http.client, os;
          client = http.client.HTTPConnection('127.0.0.1', 8000, timeout=4);
          client.request('GET', '/healthz/', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(), 'X-Forwarded-Proto': 'https'});
          raise SystemExit(client.getresponse().status != 200)
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  db:
    build:
      context: ./deploy/postgres
    restart: unless-stopped
    networks:
      - database
    environment:
      POSTGRES_DB: ${DB_NAME:-agentix}
      POSTGRES_USER: ${POSTGRES_USER:-agentix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_USER: ${DB_USER:-agentix}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$DB_PASSWORD\" psql -h 127.0.0.1 -U \"$$DB_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

volumes:
  postgres_data:

networks:
  database:
    internal: true
